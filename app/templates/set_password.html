{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow"><h1>{{ title }}</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Neues Passwort (min. 10 Zeichen)<input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
  <label>Passwort wiederholen<input type="password" name="password2" required minlength="10" autocomplete="new-password"></label>
  <button class="btn">Speichern</button>
</form></div>{% endblock %}
