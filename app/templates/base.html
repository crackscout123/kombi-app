<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} – {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('theme') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('main.dashboard') }}">{{ app_name }}</a>
  {% if me %}
  <nav>
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('main.entry_new') }}">Neue Leihe</a>
    <a href="{{ url_for('main.contacts') }}">Kontakte</a>
    <a href="{{ url_for('main.settings') }}">Einstellungen</a>
    {% if me.is_admin %}<a href="{{ url_for('admin.index') }}">Admin</a>{% endif %}
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link">Abmelden ({{ me.username }})</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
