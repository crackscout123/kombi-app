{% extends "base.html" %}{% block title %}Passwort vergessen{% endblock %}
{% block content %}
<div class="card narrow"><h1>Passwort zurücksetzen</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>E-Mail-Adresse<input type="email" name="email" required autofocus></label>
  <button class="btn">Link anfordern</button>
</form></div>{% endblock %}
